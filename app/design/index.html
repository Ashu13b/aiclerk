function ProgressRing({ pct, size = 56, stroke = 5, color, bg }) {
  const r = (size - stroke * 2) / 2;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bg} strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"/>
    </svg>
  );
}

function XPBar({ xp, max, t }) {
  const pct = Math.min(100, (xp / max) * 100);
  return (
    <div style={{ width: "100%" }}>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4, fontSize:11, color: t.muted }}>
        <span style={{ color: MED.green, fontWeight:700 }}>⚡ {xp} XP</span><span>{max}</span>
      </div>
      <div style={{ height:7, borderRadius:99, background: t.border, overflow:"hidden", position:"relative" }}>
        <div style={{ width:`${pct}%`, height:"100%", background:`linear-gradient(90deg, ${MED.green}, ${MED.cyan})`, borderRadius:99, transition:"width .4s", boxShadow:`0 0 10px ${MED.green}88` }}/>
      </div>
    </div>
  );
}

function Tag({ label, color }) {

            </div>
            <div style={{ fontSize:15, fontWeight:600, color: t.text, lineHeight:1.5 }}>{selectedQ.q}</div>

// ─── SCREEN: Quiz ────────────────────────────────────────────────────────────

function QuizScreen({ t, quizSubject }) {
  const [mode, setMode] = useState("select");
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState([]);
  const [timeLeft, setTimeLeft] = useState(90);
  const [quizMode, setQuizMode] = useState("timed");
  const [showAI, setShowAI] = useState(false);
  const timerRef = useRef(null);

  const qs = QUESTIONS;
  const q = qs[current];
  const diffColor = { easy:"#22c55e", medium:"#f59e0b", hard:"#ef4444" };

  useEffect(() => {
    if (mode === "active" && quizMode === "timed") {
      timerRef.current = setInterval(() => {
        setTimeLeft(tl => {
          if (tl <= 1) { handleNext(true); return 90; }
          return tl - 1;
        });
      }, 1000);
    }
    return () => clearInterval(timerRef.current);
  }, [mode, current, quizMode]);

  function startQuiz(m) {
    setQuizMode(m); setMode("active"); setCurrent(0); setAnswered([]); setSelected(null); setTimeLeft(90);
  }

  function handleNext(timeout = false) {
    clearInterval(timerRef.current);
    const ans = timeout ? -1 : selected;
    const newAnswered = [...answered, { qIndex: current, selected: ans, correct: ans === q.answer }];
    setAnswered(newAnswered);
    if (current + 1 < qs.length) {
      setCurrent(c => c + 1); setSelected(null); setTimeLeft(90);
    } else {
      setMode("result");
    }
  }

  if (mode === "select") {
    return (
      <div style={{ flex:1, overflowY:"auto", paddingBottom:80, background: t.bg }}>
        <div style={{ padding:"16px", background: t.card, borderBottom:`1px solid ${t.border}` }}>
          <div style={{ fontWeight:800, color: t.text, fontSize:18 }}>Start a Quiz</div>
          <div style={{ fontSize:12, color: t.muted, marginTop:2 }}>Choose your mode and subject</div>
        </div>
        <div style={{ padding:"12px 16px" }}>
          <div style={{ fontSize:11, fontWeight:700, color: t.muted, letterSpacing:1, marginBottom:8 }}>QUIZ MODE</div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {[
              { id:"timed", icon:"⏱️", label:"Timed Mode", sub:"90 sec per question", color:"#ef4444" },
              { id:"practice", icon:"📖", label:"Practice Mode", sub:"No timer — review as you go", color:"#6c63ff" },
              { id:"topic", icon:"🎯", label:"Topic-wise", sub:"Select a specific topic", color:"#f59e0b" },
              { id:"grand", icon:"🏆", label:"Grand Test", sub:"200 questions · 3 hours", color:"#22c55e" },
            ].map(m => (
              <button key={m.id} onClick={()=>startQuiz(m.id)} style={{ background: t.card, border:`1px solid ${m.color}44`, borderRadius:14, padding:14, cursor:"pointer", display:"flex", alignItems:"center", gap:12, textAlign:"left" }}>
                <div style={{ width:44, height:44, borderRadius:12, background: m.color+"22", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0 }}>{m.icon}</div>
                <div>
                  <div style={{ fontWeight:700, color: t.text, fontSize:14 }}>{m.label}</div>
                  <div style={{ fontSize:12, color: t.muted }}>{m.sub}</div>
                </div>
              </button>
            ))}
          </div>
          <div style={{ fontSize:11, fontWeight:700, color: t.muted, letterSpacing:1, marginTop:16, marginBottom:8 }}>SUBJECT</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
            {SUBJECTS.map(s => (
              <button key={s.id} onClick={()=>startQuiz("timed")} style={{ background: t.card, border:`1px solid ${s.color}44`, borderRadius:12, padding:10, cursor:"pointer", textAlign:"left" }}>
                <span style={{ fontSize:18 }}>{s.icon}</span>
                <div style={{ fontSize:12, fontWeight:700, color: t.text, marginTop:4 }}>{s.name}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (mode === "result") {
    const score = answered.filter(a=>a.correct).length;
    const pct = Math.round((score/qs.length)*100);
    return (
      <div style={{ flex:1, overflowY:"auto", paddingBottom:80, background: t.bg }}>
        <div style={{ padding:"24px 16px 12px", textAlign:"center" }}>
          <div style={{ fontSize:56, marginBottom:8 }}>{pct>=80?"🏆":pct>=60?"👍":"💪"}</div>
          <div style={{ fontSize:28, fontWeight:900, color: t.text }}>{pct}%</div>
          <div style={{ fontSize:14, color: t.muted }}>{score} / {qs.length} correct</div>
          <div style={{ display:"flex", justifyContent:"center", gap:8, marginTop:10 }}>
            <Tag label={pct>=80?"Excellent":pct>=60?"Good":"Keep Practicing"} color={pct>=80?"#22c55e":pct>=60?t.accent:t.warning}/>
          </div>
        </div>
        <div style={{ margin:"0 16px 12px", display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
          {[
            { label:"Correct", value: score, color:"#22c55e" },
            { label:"Wrong", value: qs.length-score, color:"#ef4444" },
            { label:"XP Earned", value: score*50, color: t.accent },
          ].map(s => (
            <div key={s.label} style={{ background: t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:10, textAlign:"center" }}>
              <div style={{ fontSize:20, fontWeight:900, color: s.color }}>{s.value}</div>
              <div style={{ fontSize:10, color: t.muted }}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{ margin:"0 16px" }}>
          {answered.map((a, i) => {
            const q2 = qs[a.qIndex];
            return (
              <div key={i} style={{ background: t.card, border:`1px solid ${a.correct?"#22c55e44":a.selected===-1?t.border:"#ef444444"}`, borderRadius:12, padding:10, marginBottom:8 }}>
                <div style={{ display:"flex", gap:6, marginBottom:6 }}>
                  <span style={{ fontSize:16 }}>{a.correct?"✅":a.selected===-1?"⏰":"❌"}</span>
                  <Tag label={q2.difficulty} color={diffColor[q2.difficulty]}/>
                </div>
                <div style={{ fontSize:12, color: t.text, lineHeight:1.4 }}>{q2.q}</div>
                <div style={{ fontSize:11, color: t.muted, marginTop:4 }}>Correct: {q2.options[q2.answer]}</div>
              </div>
            );
          })}
        </div>
        <div style={{ padding:"8px 16px" }}>
          <button onClick={()=>setMode("select")} style={{ width:"100%", background: t.accent, border:"none", borderRadius:12, padding:14, color:"#fff", fontWeight:700, fontSize:15, cursor:"pointer" }}>
            Try Another Quiz
          </button>
        </div>
      </div>
    );
  }

  // Active quiz
  const timerPct = (timeLeft / 90) * 100;
  const timerColor = timeLeft > 30 ? "#22c55e" : timeLeft > 15 ? t.warning : "#ef4444";

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", background: t.bg, paddingBottom:80 }}>
      {/* Header */}
      <div style={{ padding:"12px 16px", background: t.card, borderBottom:`1px solid ${t.border}` }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <button onClick={()=>setMode("select")} style={{ background:"none", border:"none", cursor:"pointer", color: t.muted, fontSize:12 }}>✕ Exit</button>
          <span style={{ fontWeight:700, color: t.text, fontSize:13 }}>{current+1} / {qs.length}</span>
          {quizMode === "timed" && (
            <div style={{ display:"flex", alignItems:"center", gap:4 }}>
              <ClockIcon color={timerColor} size={14}/>
              <span style={{ fontWeight:800, color: timerColor, fontSize:14, minWidth:24 }}>{timeLeft}s</span>
            </div>
          )}
        </div>
        {quizMode === "timed" && (
          <div style={{ height:4, borderRadius:99, background: t.border, overflow:"hidden" }}>
            <div style={{ width:`${timerPct}%`, height:"100%", background: timerColor, borderRadius:99, transition:"width 1s linear" }}/>
          </div>
        )}
        <div style={{ display:"flex", gap:4, marginTop:6 }}>
          {qs.map((_,i) => (
            <div key={i} style={{ flex:1, height:4, borderRadius:99, background: i<current ? t.accent : i===current ? t.accent+"88" : t.border }}/>
          ))}
        </div>
      </div>

      {/* Question */}
      <div style={{ flex:1, overflowY:"auto", padding:"14px 16px" }}>
        <div style={{ background: t.card, borderRadius:16, padding:16, border:`1px solid ${t.border}`, marginBottom:12 }}>
          <div style={{ display:"flex", gap:6, marginBottom:10 }}>
            <Tag label={q.difficulty} color={diffColor[q.difficulty]}/>
            <Tag label={q.subject} color={t.accent}/>
            <Tag label={q.topic} color={t.muted}/>
          </div>
          <div style={{ fontSize:14, fontWeight:600, color: t.text, lineHeight:1.6 }}>{q.q}</div>
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {q.options.map((opt, i) => {
            let bg = t.card, border = t.border, color = t.text;
            if (selected !== null) {
              if (i === q.answer) { bg="#22c55e22"; border="#22c55e"; color="#22c55e"; }
              else if (i === selected && selected !== q.answer) { bg="#ef444422"; border="#ef4444"; color="#ef4444"; }
            } else if (selected === i) {
              bg = t.accentMuted; border = t.accent; color = t.accent;
            }
            return (
              <button key={i} disabled={selected!==null} onClick={()=>setSelected(i)} style={{ background: bg, border:`2px solid ${border}`, borderRadius:12, padding:"10px 14px", cursor: selected!==null?"default":"pointer", display:"flex", alignItems:"center", gap:10, transition:"all .15s", textAlign:"left" }}>
                <div style={{ width:30, height:30, borderRadius:8, background: i===q.answer&&selected!==null ? "#22c55e" : selected===i&&selected!==null&&selected!==q.answer ? "#ef4444" : t.border, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                  {i===q.answer && selected!==null ? <CheckIcon color="#fff" size={14}/> : <span style={{ fontSize:12, fontWeight:700, color: t.muted }}>{String.fromCharCode(65+i)}</span>}
                </div>
                <span style={{ fontSize:13, color, fontWeight: selected!==null&&(i===q.answer||i===selected)?700:400, lineHeight:1.4 }}>{opt}</span>
              </button>
            );
          })}
        </div>

        {selected !== null && (
          <>
            <div style={{ background:t.accentMuted, borderRadius:12, padding:12, marginTop:10 }}>
              <div style={{ fontSize:12, fontWeight:700, color:t.accent, marginBottom:4 }}>💡 Explanation</div>
              <div style={{ fontSize:12, color:t.text, lineHeight:1.5 }}>{q.explanation}</div>
            </div>
            <button onClick={()=>setShowAI(true)} style={{ width:"100%", marginTop:8, background:`linear-gradient(135deg,${MED.green}22,${MED.cyan}22)`, border:`1px solid ${MED.green}55`, borderRadius:12, padding:"10px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:8 }}>
              <div style={{ width:26, height:26, borderRadius:8, background:`linear-gradient(135deg,${MED.green},${MED.cyan})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:13 }}>🤖</div>
              <div style={{ textAlign:"left" }}>
                <div style={{ fontSize:12, fontWeight:700, color:MED.green }}>Ask AI Tutor</div>
                <div style={{ fontSize:10, color:t.muted }}>Explain this further, mnemonics, comparisons…</div>
              </div>
            </button>
          </>
        )}
        {showAI && <AIExplainPanel t={t} question={q.q} explanation={q.explanation} onClose={()=>setShowAI(false)}/>}
      </div>

      {/* Next button */}
      <div style={{ padding:"8px 16px 12px" }}>
        <button onClick={()=>handleNext()} disabled={selected===null} style={{ width:"100%", background: selected!==null ? t.accent : t.border, border:"none", borderRadius:12, padding:14, color:"#fff", fontWeight:700, fontSize:15, cursor: selected!==null?"pointer":"not-allowed", transition:"background .2s" }}>
          {current+1 === qs.length ? "See Results" : "Next Question →"}
        </button>
      </div>
    </div>
  );
}

// ─── Live Invite Flow Component ──────────────────────────────────────────────

function LiveInviteFlow({ t, selected, subject, numQs, onAccepted, onDeclined, onCancel }) {
  // step: checking | offline | sent | accepted | declined | countdown
  const [step, setStep] = useState("checking");
  const [countdown, setCountdown] = useState(3);
  const timerRef = useRef(null);

  useEffect(() => {
    // Simulate checking online status
    const t1 = setTimeout(() => {
      if (selected?.online) setStep("sent");
      else setStep("offline");
    }, 1400);
    return () => clearTimeout(t1);
  }, []);

  useEffect(() => {
    if (step !== "sent") return;
    // Simulate friend accepting after ~3s
    const t2 = setTimeout(() => setStep("accepted"), 3000);
    return () => clearTimeout(t2);
  }, [step]);

  useEffect(() => {
    if (step !== "accepted") return;
    setCountdown(3);
    timerRef.current = setInterval(() => {
      setCountdown(c => {
        if (c <= 1) { clearInterval(timerRef.current); onAccepted(); return 0; }
        return c - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [step]);

  const avatarBox = (name, avatar, color, label) => (
    <div style={{ textAlign:"center", flex:1 }}>
      <div style={{ width:56, height:56, borderRadius:99, background:color+"33", border:`2px solid ${color}`, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color, fontSize:22, margin:"0 auto 6px" }}>{avatar}</div>
      <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{name}</div>
      {label && <div style={{ fontSize:10, color:t.muted, marginTop:2 }}>{label}</div>}
    </div>
  );

  const pulseDots = () => (
    <div style={{ display:"flex", gap:8, justifyContent:"center" }}>
      {[0,1,2].map(i => (
        <div key={i} style={{ width:10, height:10, borderRadius:99, background:t.accent, animation:`blink${i} .9s ease-in-out ${i*0.25}s infinite alternate`, opacity:.3 }}/>
      ))}
      <style>{`@keyframes blink0{to{opacity:1;transform:scale(1.3)}}@keyframes blink1{to{opacity:1;transform:scale(1.3)}}@keyframes blink2{to{opacity:1;transform:scale(1.3)}}`}</style>
    </div>
  );

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", background:t.bg, paddingBottom:80 }}>
      {/* Header */}
      <div style={{ padding:"16px", background:t.card, borderBottom:`1px solid ${t.border}`, display:"flex", alignItems:"center", gap:12 }}>
        <button onClick={onCancel} style={{ background:"none", border:"none", cursor:"pointer", color:t.accent, fontSize:20 }}>←</button>
        <div style={{ fontWeight:800, color:t.text, fontSize:16 }}>⚡ Live Duel</div>
      </div>

      <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px 28px", gap:24 }}>

        {/* VS avatars */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", width:"100%" }}>
          {avatarBox("You", "A", t.accent, "9,210 XP")}
          <div style={{ fontSize:26, fontWeight:900, color:t.muted }}>VS</div>
          {avatarBox(selected?.name, selected?.avatar, "#ef4444", `${selected?.xp?.toLocaleString()} XP`)}
        </div>

        {/* Challenge pill */}
        <div style={{ background:t.accentMuted, border:`1px solid ${t.accent}44`, borderRadius:14, padding:"8px 18px", fontSize:12, color:t.accent, fontWeight:600, textAlign:"center" }}>
          {subject} · {numQs} Questions · 20s per Q
        </div>

        {/* ── STEP: checking ── */}
        {step === "checking" && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:14 }}>
            <div style={{ width:52, height:52, borderRadius:99, border:`3px solid ${t.accent}`, borderTopColor:"transparent", animation:"spin .8s linear infinite" }}/>
            <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
            <div style={{ fontWeight:700, color:t.text, fontSize:16 }}>Checking status…</div>
            <div style={{ fontSize:12, color:t.muted }}>Seeing if {selected?.name} is online</div>
          </div>
        )}

        {/* ── STEP: offline ── */}
        {step === "offline" && (
          <div style={{ width:"100%", display:"flex", flexDirection:"column", alignItems:"center", gap:14 }}>
            <div style={{ width:52, height:52, borderRadius:99, background:"#ef444422", border:`2px solid #ef4444`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:26 }}>😴</div>
            <div style={{ fontWeight:800, color:"#ef4444", fontSize:18 }}>{selected?.name} is Offline</div>
            <div style={{ fontSize:12, color:t.muted, textAlign:"center", lineHeight:1.6 }}>
              They can't join a live duel right now.<br/>Try an Open Challenge instead — they'll answer when ready.
            </div>
            <div style={{ width:"100%", display:"flex", flexDirection:"column", gap:8 }}>
              <button onClick={onDeclined} style={{ width:"100%", background:"#6c63ff", border:"none", borderRadius:12, padding:14, color:"#fff", fontWeight:700, fontSize:14, cursor:"pointer" }}>
                📨 Switch to Open Challenge
              </button>
              <button onClick={onCancel} style={{ width:"100%", background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:12, color:t.muted, fontWeight:600, fontSize:13, cursor:"pointer" }}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {/* ── STEP: sent ── */}
        {step === "sent" && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:14, width:"100%" }}>
            <div style={{ background:"#22c55e22", border:"1px solid #22c55e44", borderRadius:12, padding:"8px 16px", display:"flex", gap:6, alignItems:"center" }}>
              <div style={{ width:8, height:8, borderRadius:99, background:"#22c55e" }}/>
              <span style={{ fontSize:12, color:"#22c55e", fontWeight:700 }}>{selected?.name} is Online</span>
            </div>
            <div style={{ fontWeight:700, color:t.text, fontSize:16 }}>Invite Sent!</div>
            <div style={{ fontSize:12, color:t.muted }}>Waiting for {selected?.name} to accept…</div>
            {pulseDots()}
            <div style={{ width:"100%", background:t.card, border:`1px solid ${t.border}`, borderRadius:14, padding:14 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                <div style={{ width:36, height:36, borderRadius:99, background:"#22c55e22", border:"2px solid #22c55e", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:"#22c55e", fontSize:16 }}>
                  {selected?.avatar}
                </div>
                <div>
                  <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{selected?.name}</div>
                  <div style={{ fontSize:11, color:"#22c55e" }}>● Online now</div>
                </div>
              </div>
              <div style={{ height:4, borderRadius:99, background:t.border, overflow:"hidden" }}>
                <div style={{ width:"60%", height:"100%", background:"#22c55e", borderRadius:99, animation:"waitBar 3s linear forwards" }}/>
              </div>
              <style>{`@keyframes waitBar{from{width:0%}to{width:100%}}`}</style>
            </div>
            <button onClick={onCancel} style={{ background:"none", border:`1px solid ${t.border}`, borderRadius:10, padding:"8px 20px", color:t.muted, fontSize:12, fontWeight:600, cursor:"pointer" }}>
              Cancel Invite
            </button>
          </div>
        )}

        {/* ── STEP: accepted ── */}
        {step === "accepted" && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:14, width:"100%" }}>
            <div style={{ fontSize:44 }}>🤝</div>
            <div style={{ fontWeight:800, color:"#22c55e", fontSize:20 }}>Challenge Accepted!</div>
            <div style={{ fontSize:13, color:t.muted }}>{selected?.name} is ready to fight</div>
            <div style={{ width:80, height:80, borderRadius:99, background:t.accent+"22", border:`4px solid ${t.accent}`, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <span style={{ fontSize:44, fontWeight:900, color:t.accent }}>{countdown}</span>
            </div>
            <div style={{ fontSize:14, color:t.muted, fontWeight:600 }}>Starting in…</div>
          </div>
        )}

        {/* ── STEP: declined ── */}
        {step === "declined" && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:14, width:"100%" }}>
            <div style={{ fontSize:44 }}>😞</div>
            <div style={{ fontWeight:800, color:"#ef4444", fontSize:18 }}>{selected?.name} Declined</div>
            <div style={{ fontSize:12, color:t.muted, textAlign:"center" }}>They're busy right now. Try again later or challenge someone else.</div>
            <div style={{ width:"100%", display:"flex", flexDirection:"column", gap:8 }}>
              <button onClick={onDeclined} style={{ width:"100%", background:"#6c63ff", border:"none", borderRadius:12, padding:14, color:"#fff", fontWeight:700, fontSize:14, cursor:"pointer" }}>
                📨 Send Open Challenge Instead
              </button>
              <button onClick={onCancel} style={{ width:"100%", background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:12, color:t.muted, fontWeight:600, fontSize:13, cursor:"pointer" }}>
                Back
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const DUEL_QS = [
  { id:1, q:"Which nerve is injured in Erb's palsy?", options:["Radial","Ulnar","C5-C6 roots","Median"], answer:2 },
  { id:2, q:"Pacemaker of the heart:", options:["AV node","Bundle of His","SA node","Purkinje fibers"], answer:2 },
  { id:3, q:"Drug of choice for status epilepticus:", options:["Phenytoin","Diazepam","Carbamazepine","Phenobarbitone"], answer:1 },
  { id:4, q:"Most common cause of secondary hypertension:", options:["Phaeochromocytoma","Renal artery stenosis","Conn's syndrome","Coarctation of aorta"], answer:1 },
  { id:5, q:"Type of necrosis in TB:", options:["Coagulative","Liquefactive","Caseous","Fat"], answer:2 },
];

function DuelScreen({ t, myName }) {
  // phase: lobby | setup | waiting | battle | async_intro | open_battle | open_pending | result | history
  const [phase, setPhase]         = useState("lobby");
  const [selected, setSelected]   = useState(null);
  const [subject, setSubject]     = useState("Mixed");
  const [numQs, setNumQs]         = useState(5);
  const [duelMode, setDuelMode]   = useState("live"); // "live" | "open"
  const [current, setCurrent]     = useState(0);
  const [pick, setPick]           = useState(null);
  const [myAnswers, setMyAnswers] = useState([]);
  const [timeLeft, setTimeLeft]   = useState(20);
  const [botAnswers]              = useState(() =>
    DUEL_QS.map(q => ({ correct: Math.random() > 0.35, time: Math.floor(Math.random()*15)+3 }))
  );
  const [botProgress, setBotProgress] = useState(0);
  const [history]                 = useState([
    { opp:"Priya S.",   result:"won",  myScore:4, oppScore:2, subject:"Pathology",    date:"Today",        mode:"live"  },
    { opp:"Rohan K.",   result:"lost", myScore:2, oppScore:5, subject:"Pharmacology", date:"Yesterday",    mode:"live"  },
    { opp:"Sneha M.",   result:"won",  myScore:5, oppScore:3, subject:"Anatomy",      date:"2 days ago",   mode:"open" },
    { opp:"Aditya R.",  result:"pending", myScore:4, oppScore:null, subject:"Biochemistry", date:"3 days ago", mode:"open" },
  ]);
  const timerRef = useRef(null);

  const qs = DUEL_QS.slice(0, numQs);
  const q  = qs[current];

  // Timer during battle
  useEffect(() => {
    if (phase !== "battle") return;
    setTimeLeft(20);
    timerRef.current = setInterval(() => {
      setTimeLeft(tl => {
        if (tl <= 1) { handleAnswer(null, true); return 20; }
        return tl - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [phase, current]);

  // Bot "typing" animation
  useEffect(() => {
    if (phase !== "battle") return;
    const delay = (botAnswers[current]?.time || 8) * 1000;
    const t2 = setTimeout(() => setBotProgress(current + 1), delay);
    return () => clearTimeout(t2);
  }, [phase, current]);

  function handleAnswer(idx, timeout = false) {
    clearInterval(timerRef.current);
    const correct = !timeout && idx === q.answer;
    const newAnswers = [...myAnswers, { idx, correct, timeout }];
    setMyAnswers(newAnswers);
    setPick(null);
    if (current + 1 < qs.length) {
      setCurrent(c => c + 1);
    } else {
      setPhase("result");
    }
  }

  function resetDuel() {
    setCurrent(0); setPick(null); setMyAnswers([]); setTimeLeft(20); setBotProgress(0);
  }

  // ── LOBBY ──
  if (phase === "lobby") {
    return (
      <div style={{ flex:1, overflowY:"auto", paddingBottom:80, background:t.bg }}>
        <div style={{ padding:"16px", background:t.card, borderBottom:`1px solid ${t.border}` }}>
          <div style={{ fontWeight:800, color:t.text, fontSize:18 }}>⚔️ Challenge a Friend</div>
          <div style={{ fontSize:12, color:t.muted, marginTop:2 }}>Pick an opponent and duel in real-time MCQs</div>
        </div>

        {/* Pending challenges */}
        <div style={{ margin:"12px 16px 0" }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>INCOMING CHALLENGES</div>
          <div style={{ background:`linear-gradient(135deg,${t.accent}22,#ef444422)`, border:`1px solid ${t.accent}55`, borderRadius:16, padding:14, display:"flex", alignItems:"center", gap:12 }}>
            <div style={{ width:44, height:44, borderRadius:99, background:t.accent, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:"#fff", fontSize:18, flexShrink:0 }}>R</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700, color:t.text, fontSize:14 }}>Rohan K. challenged you!</div>
              <div style={{ fontSize:11, color:t.muted }}>5 Qs · Pharmacology · Timed</div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              <button onClick={() => { setSelected(FRIENDS[1]); setSubject("Pharmacology"); setNumQs(5); setPhase("battle"); resetDuel(); }} style={{ background:"#22c55e", border:"none", borderRadius:8, padding:"5px 12px", color:"#fff", fontWeight:700, fontSize:11, cursor:"pointer" }}>Accept</button>
              <button style={{ background:t.border, border:"none", borderRadius:8, padding:"5px 12px", color:t.muted, fontWeight:700, fontSize:11, cursor:"pointer" }}>Decline</button>
            </div>
          </div>
        </div>

        {/* Friends list */}
        <div style={{ padding:"12px 16px 0" }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>FRIENDS</div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {FRIENDS.map(f => (
              <div key={f.id} style={{ background:t.card, border:`1px solid ${t.border}`, borderRadius:14, padding:"10px 14px", display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ position:"relative", flexShrink:0 }}>
                  <div style={{ width:42, height:42, borderRadius:99, background:t.accent+"44", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:t.accent, fontSize:17 }}>{f.avatar}</div>
                  <div style={{ position:"absolute", bottom:1, right:1, width:10, height:10, borderRadius:99, background:f.online?"#22c55e":"#555", border:`2px solid ${t.card}` }}/>
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{f.name}</div>
                  <div style={{ fontSize:11, color:t.muted }}>{f.subject} · {f.xp.toLocaleString()} XP · 🔥{f.streak}</div>
                </div>
                <button onClick={() => { setSelected(f); setPhase("setup"); }} style={{ background:t.accent, border:"none", borderRadius:10, padding:"7px 12px", color:MED.bg0, fontWeight:700, fontSize:12, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
                  <SwordsIcon color={MED.bg0} size={16}/>
                  Duel
                </button>
              </div>
            ))}
          </div>
        </div>

        {/* Past duels */}
        <div style={{ padding:"12px 16px" }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>RECENT DUELS</div>
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {history.map((h, i) => (
              <div key={i} style={{ background:t.card, border:`1px solid ${h.result==="won"?"#22c55e44":h.result==="pending"?t.accent+"44":t.border}`, borderRadius:12, padding:"10px 14px", display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ width:36, height:36, borderRadius:99, background:h.result==="won"?"#22c55e22":h.result==="pending"?t.accentMuted:"#ef444422", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>
                  {h.result==="won"?"🏆":h.result==="pending"?"⏳":"💔"}
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ fontSize:13, fontWeight:700, color:t.text }}>vs {h.opp}</span>
                    <span style={{ fontSize:9, fontWeight:700, padding:"2px 6px", borderRadius:99, background:h.mode==="live"?"#ef444422":"#6c63ff22", color:h.mode==="live"?"#ef4444":"#6c63ff" }}>{h.mode==="live"?"⚡ LIVE":"📨 OPEN"}</span>
                  </div>
                  <div style={{ fontSize:11, color:t.muted }}>{h.subject} · {h.date}</div>
                </div>
                <div style={{ textAlign:"right" }}>
                  {h.result==="pending"
                    ? <div style={{ fontSize:11, fontWeight:700, color:t.accent }}>Awaiting<br/>response</div>
                    : <>
                        <div style={{ fontWeight:800, color:h.result==="won"?"#22c55e":"#ef4444", fontSize:14 }}>{h.myScore}–{h.oppScore}</div>
                        <div style={{ fontSize:10, color:t.muted }}>{h.result==="won"?"Victory":"Defeat"}</div>
                      </>
                  }
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── SETUP ──
  if (phase === "setup") {
    const isLive = duelMode === "live";
    return (
      <div style={{ flex:1, overflowY:"auto", paddingBottom:80, background:t.bg }}>
        <div style={{ padding:"16px", background:t.card, borderBottom:`1px solid ${t.border}`, display:"flex", alignItems:"center", gap:12 }}>
          <button onClick={() => setPhase("lobby")} style={{ background:"none", border:"none", cursor:"pointer", color:t.accent, fontSize:20 }}>←</button>
          <div><div style={{ fontWeight:800, color:t.text, fontSize:16 }}>Challenge Setup</div></div>
        </div>

        {/* VS card */}
        <div style={{ margin:"16px 16px 12px", background:`linear-gradient(135deg,${t.accent}18,#6c63ff18)`, border:`1px solid ${t.accent}33`, borderRadius:20, padding:20 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ textAlign:"center", flex:1 }}>
              <div style={{ width:56, height:56, borderRadius:99, background:t.accent, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:"#fff", fontSize:22, margin:"0 auto 6px" }}>A</div>
              <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{myName}</div>
              <div style={{ fontSize:11, color:t.muted }}>9,210 XP</div>
            </div>
            <div style={{ fontSize:28, fontWeight:900, color:t.accent, padding:"0 12px" }}>VS</div>
            <div style={{ textAlign:"center", flex:1 }}>
              <div style={{ width:56, height:56, borderRadius:99, background:"#ef444422", border:`2px solid #ef4444`, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:"#ef4444", fontSize:22, margin:"0 auto 6px" }}>{selected?.avatar}</div>
              <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{selected?.name}</div>
              <div style={{ fontSize:11, color:t.muted }}>{selected?.xp.toLocaleString()} XP</div>
            </div>
          </div>
        </div>

        <div style={{ padding:"0 16px" }}>

          {/* ── DUEL MODE TOGGLE ── */}
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>BATTLE MODE</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
            {[
              { id:"live",  icon:"⚡", label:"Live Duel",  sub:"Same Qs at the same time. Race to answer fastest.", color:"#ef4444" },
              { id:"open", icon:"📨", label:"Open Challenge", sub:"You answer now. Friend plays when free.", color:"#6c63ff" },
            ].map(m => (
              <button key={m.id} onClick={()=>setDuelMode(m.id)} style={{ background: duelMode===m.id ? m.color+"22" : t.card, border:`2px solid ${duelMode===m.id ? m.color : t.border}`, borderRadius:14, padding:12, cursor:"pointer", textAlign:"left", transition:"all .15s" }}>
                <div style={{ fontSize:22, marginBottom:4 }}>{m.icon}</div>
                <div style={{ fontWeight:800, color: duelMode===m.id ? m.color : t.text, fontSize:13 }}>{m.label}</div>
                <div style={{ fontSize:10, color:t.muted, marginTop:3, lineHeight:1.4 }}>{m.sub}</div>
                {duelMode===m.id && <div style={{ marginTop:6, width:20, height:3, borderRadius:99, background:m.color }}/>}
              </button>
            ))}
          </div>

          {/* Mode detail pill */}
          <div style={{ background: isLive?"#ef444418":"#6c63ff18", border:`1px solid ${isLive?"#ef444444":"#6c63ff44"}`, borderRadius:12, padding:"8px 12px", marginBottom:16, display:"flex", gap:8, alignItems:"flex-start" }}>
            <span style={{ fontSize:14 }}>{isLive?"⚡":"📨"}</span>
            <div style={{ fontSize:11, color:t.muted, lineHeight:1.5 }}>
              {isLive
                ? "Both players receive the same questions simultaneously. A 20-second timer counts down per question. Final score is based on correct answers."
                : "You answer the questions first. A challenge link is sent to your friend. Once they complete it, results are revealed. No time pressure on either side."}
            </div>
          </div>

          {/* Subject */}
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>SUBJECT</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:16 }}>
            {["Mixed","Anatomy","Physiology","Biochemistry","Pathology","Pharmacology","Microbiology"].map(s => (
              <button key={s} onClick={()=>setSubject(s)} style={{ padding:"7px 14px", borderRadius:99, border:`1.5px solid ${subject===s?t.accent:t.border}`, background:subject===s?t.accentMuted:"none", color:subject===s?t.accent:t.muted, fontWeight:700, fontSize:12, cursor:"pointer" }}>{s}</button>
            ))}
          </div>

          {/* Number of questions */}
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>NUMBER OF QUESTIONS</div>
          <div style={{ display:"flex", gap:8, marginBottom:20 }}>
            {[5,10,15,20].map(n => (
              <button key={n} onClick={()=>setNumQs(n)} style={{ flex:1, padding:"10px 0", borderRadius:12, border:`1.5px solid ${numQs===n?t.accent:t.border}`, background:numQs===n?t.accentMuted:"none", color:numQs===n?t.accent:t.muted, fontWeight:800, fontSize:14, cursor:"pointer" }}>{n}</button>
            ))}
          </div>

          <button onClick={() => {
            resetDuel();
            if (duelMode === "live") {
              setPhase("waiting");
              setTimeout(() => setPhase("battle"), 2200);
            } else {
              setPhase("open_battle");
            }
          }} style={{ width:"100%", background: isLive?"#ef4444":t.accent, border:"none", borderRadius:14, padding:16, color:"#fff", fontWeight:800, fontSize:16, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:10 }}>
            <span>{isLive?"⚡":"📨"}</span> {isLive?"Start Live Duel":"Go First · Open Challenge"}
          </button>
        </div>
      </div>
    );
  }

  // ── OPEN CHALLENGE (you answer first, no timer) ──
  if (phase === "open_battle") {
    const qs = DUEL_QS.slice(0, numQs);
    const q  = qs[current];
    const answered = pick !== null;

    function handleAsyncAnswer(idx) {
      const correct = idx === q.answer;
      const newAnswers = [...myAnswers, { idx, correct }];
      setMyAnswers(newAnswers);
      setPick(null);
      if (current + 1 < qs.length) {
        setTimeout(() => setCurrent(c => c + 1), 500);
      } else {
        setPhase("open_pending");
      }
    }

    return (
      <div style={{ flex:1, display:"flex", flexDirection:"column", background:t.bg, paddingBottom:80 }}>
        {/* Header */}
        <div style={{ padding:"10px 16px 10px", background:t.card, borderBottom:`1px solid ${t.border}` }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <div style={{ background:"#6c63ff22", borderRadius:8, padding:"3px 10px" }}>
                <span style={{ fontSize:11, fontWeight:700, color:"#6c63ff" }}>📨 OPEN</span>
              </div>
              <span style={{ fontSize:12, color:t.muted }}>Your turn</span>
            </div>
            <span style={{ fontWeight:700, color:t.text, fontSize:13 }}>Q {current+1}/{qs.length}</span>
          </div>
          <div style={{ display:"flex", gap:3 }}>
            {qs.map((_,i)=>(
              <div key={i} style={{ flex:1, height:4, borderRadius:99, background: i<current?t.accent:i===current?t.accent+"88":t.border }}/>
            ))}
          </div>
        </div>

        {/* Opponent waiting banner */}
        <div style={{ margin:"10px 16px 0", background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:"8px 12px", display:"flex", alignItems:"center", gap:8 }}>
          <div style={{ width:28, height:28, borderRadius:99, background:"#6c63ff22", display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, fontWeight:800, color:"#6c63ff", flexShrink:0 }}>{selected?.avatar}</div>
          <div style={{ fontSize:11, color:t.muted }}><span style={{ fontWeight:700, color:t.text }}>{selected?.name}</span> will answer after you finish</div>
        </div>

        <div style={{ flex:1, overflowY:"auto", padding:"12px 16px" }}>
          <div style={{ background:t.card, borderRadius:16, padding:14, border:`1px solid ${t.border}`, marginBottom:10 }}>
            <div style={{ fontSize:14, fontWeight:600, color:t.text, lineHeight:1.6 }}>{q.q}</div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {q.options.map((opt,i) => {
              let bg=t.card, border=t.border, color=t.text;
              if (answered) {
                if (i===q.answer) { bg="#22c55e22"; border="#22c55e"; color="#22c55e"; }
                else if (i===pick && pick!==q.answer) { bg="#ef444422"; border="#ef4444"; color="#ef4444"; }
              } else if (pick===i) {
                bg=t.accentMuted; border=t.accent; color=t.accent;
              }
              return (
                <button key={i} disabled={answered} onClick={()=>{ setPick(i); setTimeout(()=>handleAsyncAnswer(i),300); }}
                  style={{ background:bg, border:`2px solid ${border}`, borderRadius:12, padding:"10px 14px", cursor:answered?"default":"pointer", display:"flex", alignItems:"center", gap:10, transition:"all .15s", textAlign:"left" }}>
                  <div style={{ width:30, height:30, borderRadius:8, background:i===q.answer&&answered?"#22c55e":i===pick&&answered&&pick!==q.answer?"#ef4444":t.border, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                    {i===q.answer&&answered?<CheckIcon color="#fff" size={14}/>:<span style={{ fontSize:12, fontWeight:700, color:t.muted }}>{String.fromCharCode(65+i)}</span>}
                  </div>
                  <span style={{ fontSize:13, color, fontWeight:answered&&(i===q.answer||i===pick)?700:400, lineHeight:1.4 }}>{opt}</span>
                </button>
              );
            })}
          </div>
          {answered && (
            <div style={{ background:t.accentMuted, borderRadius:12, padding:10, marginTop:10, fontSize:12, color:t.text }}>
              {current+1 < qs.length ? "✔ Saved! Next question loading…" : "✔ All answered! Sending to opponent…"}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ── OPEN PENDING (waiting for friend) ──
  if (phase === "open_pending") {
    const myScore = myAnswers.filter(a=>a.correct).length;
    return (
      <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", background:t.bg, gap:16, paddingBottom:80, padding:"0 24px 80px" }}>
        <div style={{ fontSize:60 }}>📨</div>
        <div style={{ fontWeight:800, color:t.text, fontSize:20, textAlign:"center" }}>Challenge Sent!</div>
        <div style={{ fontSize:13, color:t.muted, textAlign:"center", lineHeight:1.6 }}>
          You scored <span style={{ fontWeight:800, color:t.accent }}>{myScore}/{DUEL_QS.slice(0,numQs).length}</span>.<br/>
          Waiting for <span style={{ fontWeight:700, color:t.text }}>{selected?.name}</span> to take their turn.
        </div>
        {/* Share link mock */}
        <div style={{ width:"100%", background:t.card, border:`1px solid ${t.border}`, borderRadius:14, padding:14 }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:6 }}>SHARE CHALLENGE LINK</div>
          <div style={{ background:t.bg, borderRadius:10, padding:"8px 12px", display:"flex", alignItems:"center", gap:8, border:`1px solid ${t.border}` }}>
            <span style={{ fontSize:11, color:t.muted, flex:1 }}>medmcq.app/duel/xK92pQ</span>
            <button style={{ background:t.accent, border:"none", borderRadius:8, padding:"4px 10px", color:"#fff", fontWeight:700, fontSize:11, cursor:"pointer" }}>Copy</button>
          </div>
        </div>
        {/* Notify options */}
        <div style={{ width:"100%", display:"flex", flexDirection:"column", gap:8 }}>
          {[{icon:"💬", label:"Send via WhatsApp"},{icon:"📩", label:"Send via SMS"},{icon:"📋", label:"Copy Link"}].map(o=>(
            <button key={o.label} style={{ background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:"10px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontSize:18 }}>{o.icon}</span>
              <span style={{ fontSize:13, fontWeight:600, color:t.text }}>{o.label}</span>
            </button>
          ))}
        </div>
        {/* Simulate friend responding */}
        <button onClick={()=>setPhase("result")} style={{ width:"100%", background:t.accentMuted, border:`1px solid ${t.accent}`, borderRadius:12, padding:12, color:t.accent, fontWeight:700, fontSize:13, cursor:"pointer" }}>
          👀 Preview Results (Demo)
        </button>
        <button onClick={()=>{ resetDuel(); setPhase("lobby"); setSelected(null); }} style={{ background:"none", border:"none", color:t.muted, fontSize:12, cursor:"pointer" }}>← Back to Lobby</button>
      </div>
    );
  }

  // ── WAITING (live invite flow) ──
  if (phase === "waiting") {
    return <LiveInviteFlow t={t} selected={selected} subject={subject} numQs={numQs}
      onAccepted={() => { resetDuel(); setPhase("battle"); }}
      onDeclined={() => setPhase("setup")}
      onCancel={() => setPhase("setup")}
    />;
  }

  // ── BATTLE ──
  if (phase === "battle") {
    const myScore  = myAnswers.filter(a=>a.correct).length;
    const botScore = botAnswers.slice(0, current).filter(a=>a.correct).length;
    const timerPct = (timeLeft / 20) * 100;
    const timerColor = timeLeft > 8 ? "#22c55e" : timeLeft > 4 ? t.warning : "#ef4444";
    const answered = pick !== null;

    return (
      <div style={{ flex:1, display:"flex", flexDirection:"column", background:t.bg, paddingBottom:80 }}>
        {/* Duel header */}
        <div style={{ padding:"10px 16px 8px", background:t.card, borderBottom:`1px solid ${t.border}` }}>
          {/* Scoreboard */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6 }}>
            <div style={{ textAlign:"center", flex:1 }}>
              <div style={{ fontWeight:800, color:t.text, fontSize:20 }}>{myScore}</div>
              <div style={{ fontSize:10, color:t.muted, fontWeight:600 }}>{myName.split(" ")[0]}</div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:2 }}>
              <div style={{ fontSize:11, fontWeight:700, color:t.accent }}>Q {current+1}/{qs.length}</div>
              <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                <ClockIcon color={timerColor} size={12}/>
                <span style={{ fontWeight:800, color:timerColor, fontSize:13 }}>{timeLeft}s</span>
              </div>
            </div>
            <div style={{ textAlign:"center", flex:1 }}>
              <div style={{ fontWeight:800, color:"#ef4444", fontSize:20 }}>{botScore}</div>
              <div style={{ fontSize:10, color:t.muted, fontWeight:600 }}>{selected?.name.split(" ")[0]}</div>
            </div>
          </div>
          {/* Timer bar */}
          <div style={{ height:4, borderRadius:99, background:t.border, overflow:"hidden" }}>
            <div style={{ width:`${timerPct}%`, height:"100%", background:timerColor, borderRadius:99, transition:"width 1s linear" }}/>
          </div>
          {/* Q progress */}
          <div style={{ display:"flex", gap:3, marginTop:5 }}>
            {qs.map((_,i) => (
              <div key={i} style={{ flex:1, height:3, borderRadius:99, background: i<current ? t.accent : i===current ? t.accent+"88" : t.border }}/>
            ))}
          </div>
        </div>

        {/* Bot thinking indicator */}
        <div style={{ padding:"8px 16px 0", display:"flex", alignItems:"center", gap:8 }}>
          <div style={{ width:24, height:24, borderRadius:99, background:"#ef444433", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:800, color:"#ef4444", flexShrink:0 }}>{selected?.avatar}</div>
          {botProgress > current ? (
            <div style={{ fontSize:11, color:"#ef4444", fontWeight:600 }}>✓ Answered!</div>
          ) : (
            <div style={{ fontSize:11, color:t.muted, display:"flex", alignItems:"center", gap:6 }}>
              <span>Answering</span>
              <span style={{ display:"flex", gap:3 }}>
                {[0,1,2].map(i => <span key={i} style={{ display:"inline-block", width:5, height:5, borderRadius:99, background:t.muted, animation:`pulse${i} .7s ease-in-out ${i*0.2}s infinite alternate` }}/>)}
              </span>
            </div>
          )}
        </div>

        {/* Question */}
        <div style={{ flex:1, overflowY:"auto", padding:"10px 16px" }}>
          <div style={{ background:t.card, borderRadius:16, padding:14, border:`1px solid ${t.border}`, marginBottom:10 }}>
            <div style={{ fontSize:14, fontWeight:600, color:t.text, lineHeight:1.6 }}>{q.q}</div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {q.options.map((opt,i) => {
              let bg=t.card, border=t.border, color=t.text;
              if (answered) {
                if (i===q.answer) { bg="#22c55e22"; border="#22c55e"; color="#22c55e"; }
                else if (i===pick && pick!==q.answer) { bg="#ef444422"; border="#ef4444"; color="#ef4444"; }
              } else if (pick===i) {
                bg=t.accentMuted; border=t.accent; color=t.accent;
              }
              return (
                <button key={i} disabled={answered} onClick={()=>{ setPick(i); setTimeout(()=>handleAnswer(i),300); }} style={{ background:bg, border:`2px solid ${border}`, borderRadius:12, padding:"10px 14px", cursor:answered?"default":"pointer", display:"flex", alignItems:"center", gap:10, transition:"all .15s", textAlign:"left" }}>
                  <div style={{ width:30, height:30, borderRadius:8, background: i===q.answer&&answered?"#22c55e": i===pick&&answered&&pick!==q.answer?"#ef4444":t.border, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                    {i===q.answer&&answered ? <CheckIcon color="#fff" size={14}/> : <span style={{ fontSize:12, fontWeight:700, color:t.muted }}>{String.fromCharCode(65+i)}</span>}
                  </div>
                  <span style={{ fontSize:13, color, fontWeight:answered&&(i===q.answer||i===pick)?700:400, lineHeight:1.4 }}>{opt}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Skip */}
        {!answered && (
          <div style={{ padding:"4px 16px 10px" }}>
            <button onClick={()=>handleAnswer(null,true)} style={{ width:"100%", background:"none", border:`1px solid ${t.border}`, borderRadius:12, padding:10, color:t.muted, fontWeight:600, fontSize:13, cursor:"pointer" }}>
              Skip →
            </button>
          </div>
        )}
      </div>
    );
  }

  // ── RESULT ──
  if (phase === "result") {
    const myScore  = myAnswers.filter(a=>a.correct).length;
    const botScore = botAnswers.slice(0, qs.length).filter(a=>a.correct).length;
    const won = myScore > botScore;
    const draw = myScore === botScore;
    return (
      <div style={{ flex:1, overflowY:"auto", paddingBottom:80, background:t.bg }}>
        {/* Result banner */}
        <div style={{ background: won ? "linear-gradient(135deg,#22c55e22,#22c55e44)" : draw ? `linear-gradient(135deg,${t.accentMuted},${t.accent}33)` : "linear-gradient(135deg,#ef444422,#ef444444)", padding:"28px 20px 20px", textAlign:"center", borderBottom:`1px solid ${t.border}` }}>
          <div style={{ fontSize:60, marginBottom:6 }}>{won?"🏆":draw?"🤝":"💔"}</div>
          <div style={{ fontSize:26, fontWeight:900, color: won? MED.green :draw? MED.cyan : MED.red }}>{won?"Victory!":draw?"Draw!":"Defeated"}</div>
          <div style={{ fontSize:13, color:t.muted, marginTop:4 }}>{won?"You outsmarted your opponent!":draw?"Neck and neck!":"Better luck next time!"}</div>
        </div>

        {/* Score comparison */}
        <div style={{ margin:"14px 16px", background:t.card, borderRadius:20, padding:20, border:`1px solid ${t.border}` }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ textAlign:"center", flex:1 }}>
              <div style={{ width:52, height:52, borderRadius:99, background:t.accent, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:"#fff", fontSize:20, margin:"0 auto 6px" }}>A</div>
              <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{myName.split(" ")[0]}</div>
              <div style={{ fontSize:32, fontWeight:900, color:won? MED.green :draw? MED.cyan : MED.red, marginTop:4 }}>{myScore}</div>
              <div style={{ fontSize:11, color:t.muted }}>correct</div>
            </div>
            <div style={{ fontSize:22, color:t.muted }}>VS</div>
            <div style={{ textAlign:"center", flex:1 }}>
              <div style={{ width:52, height:52, borderRadius:99, background:"#ef444422", border:`2px solid #ef4444`, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:"#ef4444", fontSize:20, margin:"0 auto 6px" }}>{selected?.avatar}</div>
              <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{selected?.name.split(" ")[0]}</div>
              <div style={{ fontSize:32, fontWeight:900, color:!won&&!draw? MED.green :draw? MED.cyan : MED.red, marginTop:4 }}>{botScore}</div>
              <div style={{ fontSize:11, color:t.muted }}>correct</div>
            </div>
          </div>
          <div style={{ marginTop:16, display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
            {[
              { label:"XP Gained", val: won?"+200":draw?"+100":"+50", color: MED.green },
              { label:"Accuracy", val:`${Math.round(myScore/qs.length*100)}%`, color: MED.cyan },
              { label:"Rank Δ", val: won?"+2":draw?"—":"-1", color: won? MED.green :draw?t.muted: MED.red },
            ].map(s=>(
              <div key={s.label} style={{ background:t.bg, borderRadius:10, padding:10, textAlign:"center", border:`1px solid ${t.border}` }}>
                <div style={{ fontSize:16, fontWeight:900, color:s.color }}>{s.val}</div>
                <div style={{ fontSize:10, color:t.muted }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Q-by-Q breakdown */}
        <div style={{ padding:"0 16px 8px" }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>QUESTION BREAKDOWN</div>
          {qs.map((dq, i) => {
            const mine = myAnswers[i];
            const bot  = botAnswers[i];
            return (
              <div key={i} style={{ background:t.card, borderRadius:12, padding:"10px 14px", marginBottom:6, border:`1px solid ${t.border}`, display:"flex", alignItems:"flex-start", gap:10 }}>
                <span style={{ fontSize:16, flexShrink:0 }}>{mine?.correct?"✅":"❌"}</span>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:12, color:t.text, lineHeight:1.4, marginBottom:4 }}>{dq.q}</div>
                  <div style={{ display:"flex", gap:10 }}>
                    <span style={{ fontSize:10, color:mine?.correct?"#22c55e":"#ef4444" }}>You: {mine?.correct?"Correct":"Wrong"}</span>
                    <span style={{ fontSize:10, color:bot?.correct?"#22c55e":"#ef4444" }}>{selected?.name.split(" ")[0]}: {bot?.correct?"Correct":"Wrong"}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ padding:"4px 16px 12px", display:"flex", gap:8 }}>
          <button onClick={() => { resetDuel(); setPhase("setup"); }} style={{ flex:1, background:t.accent, border:"none", borderRadius:12, padding:14, color:"#fff", fontWeight:700, fontSize:14, cursor:"pointer" }}>Rematch</button>
          <button onClick={() => { resetDuel(); setPhase("lobby"); setSelected(null); }} style={{ flex:1, background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:14, color:t.text, fontWeight:700, fontSize:14, cursor:"pointer" }}>Back</button>
        </div>
      </div>
    );
  }

  return null;
}

// ─── Spaced Repetition Screen ─────────────────────────────────────────────────

function SpacedRepScreen({ t }) {
  const [phase, setPhase]       = useState("queue");   // queue | recall | rate | done
  const [cardIdx, setCardIdx]   = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [confidence, setConf]   = useState(null);
  const [sessionDone, setSessionDone] = useState([]);

  const due = SR_CARDS.filter(c => c.due === "now");
  const upcoming = SR_CARDS.filter(c => c.due !== "now");
  const card = due[cardIdx];

  const intervals = {
    again: "10 min", hard: "1 day", good: "3 days", easy: "7 days"
  };
  const confColors = {
    again: MED.red, hard: MED.amber, good: MED.cyan, easy: MED.green
  };
  const confEmoji = { again:"😰", hard:"😟", good:"🙂", easy:"😎" };

  function handleRate(rating) {
    setSessionDone(d => [...d, { card, rating }]);
    setConf(null); setRevealed(false);
    if (cardIdx + 1 < due.length) {
      setCardIdx(i => i + 1);
    } else {
      setPhase("done");
    }
  }

  // Forgetting curve mini-chart
  const ForgettingCurve = ({ ease }) => {
    const pts = [100, 100*Math.exp(-1/ease), 100*Math.exp(-3/ease), 100*Math.exp(-7/ease), 100*Math.exp(-14/ease)];
    const w = 100, h = 36;
    const xs = [0, 25, 50, 75, 100];
    const path = pts.map((p,i) => `${i===0?"M":"L"}${xs[i]},${h - (p/100)*h}`).join(" ");
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ opacity:.6 }}>
        <path d={path} fill="none" stroke={MED.cyan} strokeWidth="1.5" strokeLinecap="round"/>
        <circle cx={xs[0]} cy={h-(pts[0]/100)*h} r="3" fill={MED.cyan}/>
      </svg>
    );
  };

  if (phase === "done") {
    const correct = sessionDone.filter(d => d.rating === "good" || d.rating === "easy").length;
    return (
      <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", background:t.bg, paddingBottom:80, padding:"0 24px 80px", gap:16 }}>
        <div style={{ fontSize:56 }}>🧠</div>
        <div style={{ fontWeight:900, color:t.text, fontSize:22 }}>Session Complete!</div>
        <div style={{ fontSize:13, color:t.muted, textAlign:"center" }}>Your memory is now reinforced<br/>at optimal intervals</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, width:"100%" }}>
          {[
            { label:"Reviewed", val:due.length, color:t.accent },
            { label:"Retained", val:correct, color:MED.green },
            { label:"XP Earned", val:due.length*75, color:MED.amber },
          ].map(s => (
            <div key={s.label} style={{ background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:12, textAlign:"center" }}>
              <div style={{ fontSize:22, fontWeight:900, color:s.color }}>{s.val}</div>
              <div style={{ fontSize:10, color:t.muted }}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{ width:"100%", background:t.card, border:`1px solid ${MED.cyan}33`, borderRadius:14, padding:14 }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>NEXT REVIEWS</div>
          {upcoming.slice(0,3).map(c => (
            <div key={c.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
              <span style={{ fontSize:12, color:t.text }}>{c.topic}</span>
              <span style={{ fontSize:11, fontWeight:700, color:MED.amber }}>in {c.due}</span>
            </div>
          ))}
        </div>
        <button onClick={()=>{setPhase("queue");setCardIdx(0);setSessionDone([]);}} style={{ width:"100%", background:t.accent, border:"none", borderRadius:12, padding:14, color:MED.bg0, fontWeight:800, fontSize:15, cursor:"pointer" }}>
          Back to Queue
        </button>
      </div>
    );
  }

  // Queue view
  if (phase === "queue") {
    return (
      <div style={{ flex:1, overflowY:"auto", paddingBottom:80, background:t.bg }}>
        <div style={{ padding:"16px", background:t.card, borderBottom:`1px solid ${t.border}` }}>
          <div style={{ fontWeight:800, color:t.text, fontSize:18 }}>Spaced Repetition</div>
          <div style={{ fontSize:12, color:t.muted, marginTop:2 }}>Review at the perfect moment to beat forgetting</div>
        </div>

        {/* Due now banner */}
        <div style={{ margin:"12px 16px 0" }}>
          <div className="glow-green" style={{ background:`linear-gradient(135deg,${MED.green}18,${MED.cyan}18)`, border:`1px solid ${MED.green}55`, borderRadius:16, padding:16 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
              <div>
                <div style={{ fontSize:11, fontWeight:700, color:MED.green, letterSpacing:1 }}>DUE NOW</div>
                <div style={{ fontSize:26, fontWeight:900, color:t.text }}>{due.length} cards</div>
                <div style={{ fontSize:12, color:t.muted }}>Est. {due.length * 2} min · +{due.length*75} XP</div>
              </div>
              <div style={{ position:"relative" }}>
                <svg width="70" height="70" viewBox="0 0 70 70" style={{ transform:"rotate(-90deg)" }}>
                  <circle cx="35" cy="35" r="28" fill="none" stroke={t.border} strokeWidth="5"/>
                  <circle cx="35" cy="35" r="28" fill="none" stroke={MED.green} strokeWidth="5"
                    strokeDasharray={`${(due.length/(due.length+upcoming.length))*176} 176`} strokeLinecap="round"/>
                </svg>
                <span style={{ position:"absolute", top:"50%", left:"50%", transform:"translate(-50%,-50%)", fontSize:14, fontWeight:900, color:MED.green }}>{due.length}</span>
              </div>
            </div>
            <button onClick={()=>setPhase("recall")} style={{ width:"100%", background:MED.green, border:"none", borderRadius:12, padding:12, color:MED.bg0, fontWeight:800, fontSize:15, cursor:"pointer" }}>
              Start Review →
            </button>
          </div>
        </div>

        {/* Forgetting curve explainer */}
        <div style={{ margin:"12px 16px 0", background:t.card, borderRadius:14, padding:14, border:`1px solid ${t.border}` }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <div style={{ fontSize:13, fontWeight:700, color:t.text }}>Your Memory Curve</div>
            <div style={{ fontSize:10, color:MED.cyan }}>Ebbinghaus Model</div>
          </div>
          <div style={{ display:"flex", alignItems:"flex-end", gap:6, height:48 }}>
            {["Day 1","Day 3","Day 7","Day 14","Day 30"].map((d,i) => {
              const vals = [100,70,50,30,15];
              return (
                <div key={d} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
                  <div style={{ width:"100%", height:`${vals[i]*0.44}px`, background:`linear-gradient(180deg,${MED.cyan},${MED.cyan}44)`, borderRadius:"4px 4px 0 0" }}/>
                  <div style={{ fontSize:8, color:t.muted, textAlign:"center" }}>{d}</div>
                </div>
              );
            })}
          </div>
          <div style={{ fontSize:11, color:t.muted, marginTop:6, lineHeight:1.5 }}>Without review, you forget ~70% in 24h. Spaced repetition cuts this to &lt;10%.</div>
        </div>

        {/* Upcoming cards */}
        <div style={{ padding:"12px 16px" }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>UPCOMING</div>
          {upcoming.map(c => (
            <div key={c.id} style={{ background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:"10px 14px", marginBottom:6, display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:36, height:36, borderRadius:10, background:t.border, display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, color:t.muted, flexShrink:0, textAlign:"center", lineHeight:1.2 }}>{c.due}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:12, fontWeight:700, color:t.text }}>{c.topic}</div>
                <div style={{ fontSize:11, color:t.muted }}>{c.subject} · {c.reps} reps</div>
              </div>
              <div style={{ display:"flex", gap:3 }}>
                {[...Array(Math.min(c.reps,5))].map((_,i)=><div key={i} style={{ width:5, height:5, borderRadius:99, background:MED.green }}/>)}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Recall phase — show question, hide answer
  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", background:t.bg, paddingBottom:80 }}>
      {/* Header */}
      <div style={{ padding:"12px 16px 10px", background:t.card, borderBottom:`1px solid ${t.border}` }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
          <button onClick={()=>setPhase("queue")} style={{ background:"none", border:"none", cursor:"pointer", color:t.muted, fontSize:12 }}>✕ Exit</button>
          <span style={{ fontWeight:700, color:t.text, fontSize:13 }}>{cardIdx+1} / {due.length}</span>
          <span style={{ fontSize:11, color:MED.cyan }}>🧠 Active Recall</span>
        </div>
        <div style={{ display:"flex", gap:3 }}>
          {due.map((_,i) => <div key={i} style={{ flex:1, height:3, borderRadius:99, background: i<cardIdx?MED.green:i===cardIdx?MED.green+"88":t.border }}/>)}
        </div>
      </div>

      <div style={{ flex:1, overflowY:"auto", padding:"16px" }}>
        {/* Subject tag */}
        <div style={{ display:"flex", gap:6, marginBottom:12 }}>
          <Tag label={card.subject} color={t.accent}/>
          <Tag label={card.topic} color={t.muted}/>
          <Tag label={`rep #${card.reps}`} color={MED.violet}/>
        </div>

        {/* Question card */}
        <div style={{ background:t.card, borderRadius:16, padding:18, border:`1px solid ${t.border}`, marginBottom:12 }}>
          <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>RECALL THIS</div>
          <div style={{ fontSize:15, fontWeight:600, color:t.text, lineHeight:1.6 }}>{card.q}</div>
        </div>

        {/* Confidence pre-rating (metacognition) */}
        {!revealed && (
          <div style={{ background:t.card, borderRadius:14, padding:14, border:`1px solid ${MED.violet}44`, marginBottom:12 }}>
            <div style={{ fontSize:11, fontWeight:700, color:MED.violet, marginBottom:10 }}>HOW WELL DO YOU KNOW THIS?</div>
            <div style={{ display:"flex", gap:6 }}>
              {[
                { id:"blank", label:"No idea", color:MED.red },
                { id:"partial", label:"Vaguely", color:MED.amber },
                { id:"sure", label:"Pretty sure", color:MED.cyan },
                { id:"nailed", label:"100%", color:MED.green },
              ].map(c => (
                <button key={c.id} onClick={()=>{ setConf(c.id); setRevealed(true); }} style={{ flex:1, background:confidence===c.id?c.color+"22":t.bg, border:`1.5px solid ${confidence===c.id?c.color:t.border}`, borderRadius:10, padding:"8px 4px", cursor:"pointer", textAlign:"center" }}>
                  <div style={{ fontSize:16 }}>{c.id==="blank"?"😰":c.id==="partial"?"😟":c.id==="sure"?"🙂":"😎"}</div>
                  <div style={{ fontSize:9, color:c.color, fontWeight:700, marginTop:3 }}>{c.label}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Answer reveal */}
        {revealed && (
          <>
            <div style={{ background:`linear-gradient(135deg,${MED.green}18,${MED.cyan}18)`, borderRadius:14, padding:14, border:`1px solid ${MED.green}55`, marginBottom:12 }}>
              <div style={{ fontSize:11, fontWeight:700, color:MED.green, marginBottom:6 }}>✓ ANSWER</div>
              <div style={{ fontSize:15, fontWeight:700, color:t.text, lineHeight:1.5 }}>{card.answer}</div>
            </div>

            {/* Peer mnemonic */}
            {PEER_MNEMONICS[card.id] && (
              <div style={{ background:t.card, borderRadius:12, padding:12, border:`1px solid ${MED.violet}44`, marginBottom:12 }}>
                <div style={{ fontSize:10, fontWeight:700, color:MED.violet, marginBottom:6 }}>💡 PEER MNEMONIC</div>
                <div style={{ fontSize:12, color:t.text, lineHeight:1.5, fontStyle:"italic" }}>"{PEER_MNEMONICS[card.id][0].text}"</div>
                <div style={{ fontSize:10, color:t.muted, marginTop:4 }}>— {PEER_MNEMONICS[card.id][0].user} · {PEER_MNEMONICS[card.id][0].likes} likes</div>
              </div>
            )}

            {/* Rate how it went */}
            <div style={{ background:t.card, borderRadius:14, padding:14, border:`1px solid ${t.border}` }}>
              <div style={{ fontSize:11, fontWeight:700, color:t.muted, marginBottom:10 }}>HOW DID IT GO?</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:6 }}>
                {["again","hard","good","easy"].map(r => (
                  <button key={r} onClick={()=>handleRate(r)} style={{ background:confColors[r]+"18", border:`1.5px solid ${confColors[r]}55`, borderRadius:10, padding:"10px 4px", cursor:"pointer", textAlign:"center" }}>
                    <div style={{ fontSize:18 }}>{confEmoji[r]}</div>

                    <div style={{ fontSize:9, color:t.muted, marginTop:1 }}>{intervals[r]}</div>
                  </button>
                ))}
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function QuestScreen({ t, studentName }) {
  const [quests, setQuests]         = useState(DAILY_QUESTS);
  const [bonusUnlocked, setBonusUnlocked] = useState(false);
  const [showReward, setShowReward] = useState(null);
  const allDone = quests.every(q => q.done >= q.target);

  function completeQuest(id) {
    setQuests(qs => qs.map(q => q.id===id ? {...q, done: Math.min(q.target, q.done+1)} : q));
    const q = quests.find(q=>q.id===id);
    if (q && q.done+1 >= q.target) setShowReward(q);
  }

  const totalXP = quests.reduce((a,q) => a + (q.done >= q.target ? q.xp : 0), 0);
  const maxXP   = quests.reduce((a,q) => a + q.xp, 0);
  const resetHour = new Date(); resetHour.setHours(24,0,0,0);
  const hoursLeft = Math.round((resetHour - new Date()) / 3600000);

  return (
    <div style={{ flex:1, overflowY:"auto", paddingBottom:80, background:t.bg }}>
      {/* Reward popup */}
      {showReward && (
        <div style={{ position:"fixed", inset:0, zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.8)" }} onClick={()=>setShowReward(null)}>
          <div style={{ background:t.card, borderRadius:24, padding:32, textAlign:"center", border:`2px solid ${showReward.color}`, maxWidth:280, animation:"popIn .3s ease" }}>
            <style>{`@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}`}</style>
            <div style={{ fontSize:56, marginBottom:8 }}>🎉</div>
            <div style={{ fontWeight:900, color:showReward.color, fontSize:22 }}>Quest Complete!</div>
            <div style={{ fontSize:14, color:t.text, marginTop:4 }}>{showReward.label}</div>
            <div style={{ fontSize:28, fontWeight:900, color:MED.amber, marginTop:12 }}>+{showReward.xp} XP</div>
            <div style={{ fontSize:12, color:t.muted, marginTop:4 }}>Tap to continue</div>
          </div>
        </div>
      )}

      <div style={{ padding:"16px", background:t.card, borderBottom:`1px solid ${t.border}` }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <div style={{ fontWeight:800, color:t.text, fontSize:18 }}>Daily Quests</div>
            <div style={{ fontSize:12, color:t.muted, marginTop:2 }}>Resets in {hoursLeft}h · {totalXP}/{maxXP} XP earned</div>
          </div>
          <div style={{ background:MED.amber+"22", border:`1px solid ${MED.amber}55`, borderRadius:12, padding:"6px 12px", textAlign:"center" }}>
            <div style={{ fontSize:18, fontWeight:900, color:MED.amber }}>{totalXP}</div>
            <div style={{ fontSize:9, color:t.muted }}>XP Today</div>
          </div>
        </div>
        {/* Overall progress */}
        <div style={{ marginTop:10, height:6, borderRadius:99, background:t.border, overflow:"hidden" }}>

function NotifScreen({ t, onClose }) {
  const [notifs, setNotifs] = useState(NOTIFS);
  const unreadCount = notifs.filter(n=>n.unread).length;

  function markRead(id) { setNotifs(ns => ns.map(n => n.id===id ? {...n,unread:false} : n)); }
  function dismiss(id)  { setNotifs(ns => ns.filter(n => n.id!==id)); }

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", background:t.bg, paddingBottom:80 }}>
      <div style={{ padding:"16px", background:t.card, borderBottom:`1px solid ${t.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>

        </div>
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={()=>setNotifs(ns=>ns.map(n=>({...n,unread:false})))} style={{ background:t.accentMuted, border:"none", borderRadius:8, padding:"5px 12px", color:t.accent, fontSize:11, fontWeight:700, cursor:"pointer" }}>Mark all read</button>

        </div>
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:"12px 16px" }}>
        {notifs.length===0 && (
          <div style={{ textAlign:"center", padding:40, color:t.muted }}>
            <div style={{ fontSize:40, marginBottom:8 }}>🔔</div>
            <div>All caught up!</div>
          </div>
        )}
        {notifs.map(n => (
          <div key={n.id} onClick={()=>markRead(n.id)} style={{ background:n.unread?n.color+"12":t.card, border:`1px solid ${n.unread?n.color+"44":t.border}`, borderRadius:14, padding:12, marginBottom:8, cursor:"pointer", position:"relative" }}>
