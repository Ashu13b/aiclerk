      <button disabled={!data.name.trim()} onClick={()=>setStep(2)} style={{ background:data.name.trim()?MED.green:t.border, border:"none", borderRadius:14, padding:16, color:MED.bg0, fontWeight:800, fontSize:16, cursor:data.name.trim()?"pointer":"not-allowed" }}>Continue →</button>
    </div>
  );

  // Year
  if (step === 2) return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", background:t.bg, padding:"32px 24px 80px" }}>
      <ProgressDots total={steps.length-1} current={step} t={t}/>
      <div style={{ fontSize:24, fontWeight:900, color:t.text, marginBottom:6, marginTop:16 }}>Which year are you in?</div>
      <div style={{ fontSize:13, color:t.muted, marginBottom:24 }}>We'll personalise your question difficulty</div>
      <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
        {years.map(y => (
          <button key={y} onClick={()=>setData(d=>({...d,year:y}))} style={{ background:data.year===y?MED.green+"22":t.card, border:`2px solid ${data.year===y?MED.green:t.border}`, borderRadius:12, padding:"12px 16px", cursor:"pointer", textAlign:"left", color:data.year===y?MED.green:t.text, fontWeight:data.year===y?700:400, fontSize:14, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            {y}
            {data.year===y && <span style={{ fontSize:16 }}>✓</span>}
          </button>
        ))}
      </div>
      <button disabled={!data.year} onClick={()=>setStep(3)} style={{ background:data.year?MED.green:t.border, border:"none", borderRadius:14, padding:16, color:MED.bg0, fontWeight:800, fontSize:16, cursor:data.year?"pointer":"not-allowed" }}>Continue →</button>
    </div>
  );

  // Exam
  if (step === 3) return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", background:t.bg, padding:"32px 24px 80px" }}>
      <ProgressDots total={steps.length-1} current={step} t={t}/>
      <div style={{ fontSize:24, fontWeight:900, color:t.text, marginBottom:6, marginTop:16 }}>Your target exam?</div>
      <div style={{ fontSize:13, color:t.muted, marginBottom:24 }}>We'll weight questions by exam pattern</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
        {exams.map(e => (
          <button key={e.id} onClick={()=>setData(d=>({...d,exam:e.id}))} style={{ background:data.exam===e.id?MED.green+"22":t.card, border:`2px solid ${data.exam===e.id?MED.green:t.border}`, borderRadius:14, padding:14, cursor:"pointer", textAlign:"left" }}>
            <div style={{ fontSize:28, marginBottom:6 }}>{e.icon}</div>
            <div style={{ fontWeight:800, color:data.exam===e.id?MED.green:t.text, fontSize:14 }}>{e.label}</div>
            <div style={{ fontSize:11, color:t.muted, marginTop:2 }}>{e.sub}</div>
          </button>
        ))}
      </div>
      <button disabled={!data.exam} onClick={()=>setStep(4)} style={{ background:data.exam?MED.green:t.border, border:"none", borderRadius:14, padding:16, color:MED.bg0, fontWeight:800, fontSize:16, cursor:data.exam?"pointer":"not-allowed" }}>Continue →</button>
    </div>
  );

  // Subjects
  if (step === 4) return (
    <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column", background:t.bg, padding:"32px 24px 80px" }}>
      <ProgressDots total={steps.length-1} current={step} t={t}/>
      <div style={{ fontSize:24, fontWeight:900, color:t.text, marginBottom:6, marginTop:16 }}>Focus subjects?</div>
      <div style={{ fontSize:13, color:t.muted, marginBottom:24 }}>Pick the ones you want to prioritise (select all that apply)</div>
      <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
        {allSubs.map(s => {
          const sel = data.subjects.includes(s.id);
          return (
            <button key={s.id} onClick={()=>toggleSubject(s.id)} style={{ background:sel?s.color+"22":t.card, border:`2px solid ${sel?s.color:t.border}`, borderRadius:12, padding:"10px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontSize:20 }}>{s.icon}</span>
              <span style={{ flex:1, textAlign:"left", fontWeight:sel?700:400, color:sel?s.color:t.text, fontSize:14 }}>{s.name}</span>
              {sel && <span style={{ color:s.color }}>✓</span>}
            </button>
          );
        })}
      </div>
      <button onClick={()=>setStep(5)} style={{ background:MED.green, border:"none", borderRadius:14, padding:16, color:MED.bg0, fontWeight:800, fontSize:16, cursor:"pointer" }}>
        {data.subjects.length===0?"Skip →":"Continue →"}
      </button>
    </div>
  );

  // Gamification explainer
  if (step === 5) return (
    <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column", background:t.bg, padding:"32px 24px 80px" }}>
      <ProgressDots total={steps.length-1} current={step} t={t}/>
      <div style={{ fontSize:24, fontWeight:900, color:t.text, marginBottom:6, marginTop:16 }}>How the rewards work</div>
      <div style={{ fontSize:13, color:t.muted, marginBottom:20 }}>Understanding your numbers makes studying more motivating</div>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:20 }}>
        {[
          { icon:"⚡", label:"XP (Experience Points)", color:MED.green,
            explain:"You earn XP for every question you answer. Correct = 50 XP, Wrong = 10 XP (for trying). XP levels you up and raises your rank. Think of it as your study effort score." },
          { icon:"🔥", label:"Streak", color:MED.amber,
            explain:"Every day you study, your streak grows. A 7-day streak = bonus XP. A 30-day streak = badge. Miss a day and it resets — but you have 1 Streak Freeze to protect it." },
          { icon:"🏆", label:"Rank", color:MED.cyan,
            explain:"Your rank compares your XP to all students. #1 = highest XP overall. You can also rank by subject — be #1 in Pharmacology while still learning Anatomy." },
          { icon:"🧠", label:"Spaced Repetition Score", color:MED.violet,
            explain:"Based on how many cards you've reviewed on schedule. Higher = stronger long-term memory. Science shows this predicts exam performance better than raw practice." },
          { icon:"⭐", label:"Daily Quests", color:MED.amber,
            explain:"3 small goals each day. Complete all 3 = bonus XP multiplier unlocked for tomorrow. Quests reset every midnight." },
        ].map(item => (
          <GamifyCard key={item.label} item={item} t={t}/>
        ))}
      </div>
      <button onClick={()=>onComplete(data)} style={{ width:"100%", background:`linear-gradient(135deg,${MED.green},${MED.cyan})`, border:"none", borderRadius:14, padding:16, color:MED.bg0, fontWeight:800, fontSize:16, cursor:"pointer" }}>
        Let's go, {data.name || "Doctor"}! 🩺
      </button>
    </div>
  );

  return null;
}

function ProgressDots({ total, current, t }) {
  return (
    <div style={{ display:"flex", gap:6 }}>
      {[...Array(total)].map((_,i) => (
        <div key={i} style={{ height:4, flex:1, borderRadius:99, background: i<current?MED.green:i===current?MED.green+"88":t.border, transition:"background .3s" }}/>
      ))}
    </div>
  );
}

function GamifyCard({ item, t }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ background:t.card, border:`1px solid ${open?item.color+"55":t.border}`, borderRadius:14, overflow:"hidden", transition:"border .2s" }}>
      <button onClick={()=>setOpen(o=>!o)} style={{ width:"100%", background:"none", border:"none", padding:"12px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:10, textAlign:"left" }}>
        <div style={{ width:40, height:40, borderRadius:12, background:item.color+"22", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>{item.icon}</div>
        <div style={{ flex:1 }}>
          <div style={{ fontWeight:700, color:t.text, fontSize:13 }}>{item.label}</div>
        </div>
        <div style={{ color:t.muted, fontSize:16, transition:"transform .2s", transform:open?"rotate(180deg)":"rotate(0deg)" }}>▾</div>
      </button>
      {open && (
        <div style={{ padding:"0 14px 12px 64px", fontSize:12, color:t.muted, lineHeight:1.6, borderTop:`1px solid ${t.border}`, paddingTop:10 }}>
          {item.explain}
        </div>
      )}
    </div>
  );
}

// ─── AI Explanation Component ─────────────────────────────────────────────────

function AIExplainPanel({ t, question, explanation, onClose }) {
  const [messages, setMessages] = useState([
    { role:"ai", text: explanation }
  ]);
  const [input, setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);

  useEffect(() => {
    if (endRef.current) endRef.current.scrollTop = endRef.current.scrollHeight;
  }, [messages]);

  async function askAI() {
    if (!input.trim()) return;
    const q = input.trim();
    setInput("");
    setMessages(m => [...m, { role:"user", text:q }]);
    setLoading(true);
    try {
      const prompt = `You are a medical MCQ tutor for MBBS students. The question was: "${question}". The student asks: "${q}". Give a concise, clinically useful answer in 2-3 sentences. Use simple language.`;
      const reply = await window.claude.complete(prompt);
      setMessages(m => [...m, { role:"ai", text:reply }]);
    } catch(e) {
      setMessages(m => [...m, { role:"ai", text:"Sorry, couldn't connect. Try again!" }]);
    }
    setLoading(false);
  }

  return (
    <div style={{ position:"fixed", inset:0, zIndex:300, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={onClose} style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.75)", backdropFilter:"blur(4px)" }}/>
      <div style={{ position:"relative", width:"100%", maxWidth:402, background:t.card, borderRadius:"24px 24px 0 0", border:`1px solid ${t.border}`, borderBottom:"none", zIndex:1, maxHeight:"75vh", display:"flex", flexDirection:"column" }}>
        <div style={{ display:"flex", justifyContent:"center", padding:"10px 0 0" }}>
          <div style={{ width:40, height:4, borderRadius:99, background:t.border }}/>
        </div>
        <div style={{ padding:"10px 16px", borderBottom:`1px solid ${t.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <div style={{ width:28, height:28, borderRadius:8, background:`linear-gradient(135deg,${MED.green},${MED.cyan})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 }}>🤖</div>
            <div>
              <div style={{ fontWeight:800, color:t.text, fontSize:14 }}>AI Tutor</div>
              <div style={{ fontSize:10, color:MED.green }}>● Ask anything about this question</div>
            </div>
          </div>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", color:t.muted, fontSize:18 }}>✕</button>
        </div>
        {/* Messages */}
        <div ref={endRef} style={{ flex:1, overflowY:"auto", padding:"12px 16px", display:"flex", flexDirection:"column", gap:10 }}>
          {messages.map((m,i) => (
            <div key={i} style={{ display:"flex", flexDirection:m.role==="user"?"row-reverse":"row", gap:8, alignItems:"flex-end" }}>
              {m.role==="ai" && <div style={{ width:26, height:26, borderRadius:8, background:`linear-gradient(135deg,${MED.green},${MED.cyan})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, flexShrink:0 }}>🤖</div>}
              <div style={{ maxWidth:"80%", background:m.role==="ai"?t.bg:MED.green, border:`1px solid ${m.role==="ai"?t.border:"transparent"}`, borderRadius:m.role==="ai"?"14px 14px 14px 4px":"14px 14px 4px 14px", padding:"10px 12px" }}>
                <div style={{ fontSize:13, color:m.role==="ai"?t.text:MED.bg0, lineHeight:1.5 }}>{m.text}</div>
              </div>
            </div>
          ))}
          {loading && (
            <div style={{ display:"flex", gap:8, alignItems:"flex-end" }}>
              <div style={{ width:26, height:26, borderRadius:8, background:`linear-gradient(135deg,${MED.green},${MED.cyan})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12 }}>🤖</div>
              <div style={{ background:t.bg, border:`1px solid ${t.border}`, borderRadius:"14px 14px 14px 4px", padding:"10px 14px", display:"flex", gap:4 }}>
                {[0,1,2].map(i=><div key={i} style={{ width:6, height:6, borderRadius:99, background:MED.green, animation:`blink${i} .7s ease-in-out ${i*0.2}s infinite alternate` }}/>)}
              </div>
            </div>
          )}
        </div>
        {/* Suggested questions */}
        <div style={{ padding:"6px 16px", display:"flex", gap:6, overflowX:"auto" }}>
          {["Why is this the answer?","What's the mechanism?","Give me a mnemonic","Compare with similar drugs"].map(s => (
            <button key={s} onClick={()=>{ setInput(s); }} style={{ background:t.accentMuted, border:`1px solid ${t.accent}44`, borderRadius:99, padding:"4px 10px", cursor:"pointer", whiteSpace:"nowrap", fontSize:11, color:t.accent, fontWeight:600, flexShrink:0 }}>{s}</button>
          ))}
        </div>
        {/* Input */}
        <div style={{ padding:"8px 16px 20px", display:"flex", gap:8 }}>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&askAI()} placeholder="Ask about this question…" style={{ flex:1, background:t.bg, border:`1px solid ${t.border}`, borderRadius:12, padding:"10px 14px", color:t.text, fontSize:13, outline:"none" }}/>
          <button onClick={askAI} disabled={loading||!input.trim()} style={{ background:input.trim()&&!loading?MED.green:t.border, border:"none", borderRadius:12, width:42, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", transition:"background .2s" }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={MED.bg0} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

      {tab === "overview" && (

              { label:"Skipped",   val:r.skipped,  color:MED.amber,  icon:"⏭️" },

      {tab === "analysis" && (
        <div style={{ padding:"12px 16px" }}>
          {[

            <div key={s.label} style={{ background:t.card, border:`1px solid ${s.color}33`, borderRadius:14, padding:14, marginBottom:10 }}>

          <button style={{ width:"100%", background:MED.green, border:"none", borderRadius:12, padding:14, color:MED.bg0, fontWeight:800, fontSize:14, cursor:"pointer", marginTop:4 }}>
            🧠 Start Targeted Review
          </button>
        </div>
      )}
    </div>
  );
}

    <div style={{ position:"fixed", inset:0, zIndex:200, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={onClose} style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.75)", backdropFilter:"blur(4px)" }}/>
      <div style={{ position:"relative", width:"100%", maxWidth:402, background:t.card, borderRadius:"24px 24px 0 0", border:`1px solid ${t.border}`, borderBottom:"none", zIndex:1 }}>
        <div style={{ display:"flex", justifyContent:"center", padding:"10px 0 0" }}>
          <div style={{ width:40, height:4, borderRadius:99, background:t.border }}/>
        </div>
        <div style={{ padding:"14px 20px 10px", display:"flex", justifyContent:"space-between", alignItems:"center", borderBottom:`1px solid ${t.border}` }}>
          <div style={{ fontWeight:800, color:t.text, fontSize:17 }}>Share Progress</div>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", color:t.muted, fontSize:20 }}>✕</button>
        </div>
        <div style={{ padding:"16px 20px 32px" }}>
          {/* Preview card */}
          <div style={{ background:MED.bg0, border:`1px solid ${MED.green}44`, borderRadius:16, padding:16, marginBottom:14, position:"relative", overflow:"hidden" }}>
            <svg style={{ position:"absolute", bottom:8, right:8, opacity:.1 }} width="80" height="30" viewBox="0 0 80 30">
              <polyline points="0,15 10,15 15,5 20,25 25,15 35,15 40,2 45,28 50,15 60,15 65,8 70,22 75,15 80,15" fill="none" stroke={MED.green} strokeWidth="2"/>
            </svg>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
              <div style={{ width:40, height:40, borderRadius:99, background:MED.green+"22", border:`2px solid ${MED.green}`, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:MED.green, fontSize:16 }}>A</div>
              <div>
                <div style={{ fontWeight:700, color:t.text, fontSize:14 }}>Dr. Aryan</div>
                <div style={{ fontSize:11, color:MED.green }}>MedMCQ · MBBS</div>
              </div>
              {visibility==="public" && isGoodRank && (
                <div className="glow-green" style={{ marginLeft:"auto", background:MED.green+"22", border:`1px solid ${MED.green}`, borderRadius:10, padding:"3px 10px", fontSize:11, fontWeight:800, color:MED.green }}>🏆 Top {rank<=3?rank:"10"}</div>
              )}
            </div>
            <div style={{ display:"flex", gap:8 }}>
              {[
                { val:`#${rank}`, label:"Global Rank", color:MED.green },
                { val:`${score}%`, label:"Accuracy", color:MED.cyan },
                { val:"29🔥", label:"Streak", color:MED.amber },
              ].map(s => (
                <div key={s.label} style={{ flex:1, background:s.color+"15", borderRadius:10, padding:"8px 6px", textAlign:"center" }}>
                  <div style={{ fontSize:18, fontWeight:900, color:s.color }}>{s.val}</div>
                  <div style={{ fontSize:9, color:t.muted }}>{s.label}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop:8, fontSize:11, color:t.muted, textAlign:"center" }}>{subject}</div>
          </div>

          {/* Visibility toggle */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:11, fontWeight:700, color:t.muted, letterSpacing:1, marginBottom:8 }}>WHO CAN SEE THIS</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              {[
                { id:"friends", icon:"👥", label:"Friends Only", sub:"Only people you follow", color:MED.cyan },
                { id:"public",  icon:"🌐", label:"Go Public",    sub:"Visible to all students", color:MED.green, badge: isGoodRank?"Recommended ✨":null },
              ].map(v => (
                <button key={v.id} onClick={()=>setVisibility(v.id)} style={{ background:visibility===v.id?v.color+"18":t.bg, border:`2px solid ${visibility===v.id?v.color:t.border}`, borderRadius:12, padding:10, cursor:"pointer", textAlign:"left", position:"relative" }}>
                  {v.badge && visibility==="friends" && (
                    <div style={{ position:"absolute", top:-8, right:6, background:MED.amber, borderRadius:99, padding:"2px 8px", fontSize:9, fontWeight:800, color:"#000" }}>{v.badge}</div>
                  )}
                  <div style={{ fontSize:20, marginBottom:4 }}>{v.icon}</div>
                  <div style={{ fontWeight:700, color:visibility===v.id?v.color:t.text, fontSize:12 }}>{v.label}</div>
                  <div style={{ fontSize:10, color:t.muted, marginTop:2 }}>{v.sub}</div>
                </button>
              ))}
            </div>
            {visibility==="public" && isGoodRank && (
              <div style={{ marginTop:8, background:MED.green+"15", border:`1px solid ${MED.green}44`, borderRadius:10, padding:"8px 12px", fontSize:11, color:MED.green }}>
                ✨ You're in the top 10 — other students can discover and challenge you!
              </div>
            )}
          </div>

          {/* Share text preview */}
          <div style={{ background:t.bg, borderRadius:10, padding:"10px 12px", border:`1px solid ${t.border}`, marginBottom:14, fontSize:12, color:t.muted, lineHeight:1.5, fontStyle:"italic" }}>
            "{shareText}"
          </div>

          {/* Platform buttons */}
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {[
              { icon:"💬", label:"WhatsApp",        color:"#25d366" },
              { icon:"📸", label:"Instagram Story", color:"#e1306c" },
              { icon:"𝕏",  label:"X / Twitter",    color:t.dark?"#e8f4f0":"#000" },
              { icon:"📋", label:"Copy Link",       color:t.muted, action:"copy" },
            ].map(p => (
              <button key={p.label} onClick={()=>p.action==="copy"?setCopied(true):setShared(true)}
                style={{ background:t.bg, border:`1px solid ${p.color}55`, borderRadius:12, padding:"10px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:12 }}>
                <span style={{ fontSize:20, width:28, textAlign:"center" }}>{p.icon}</span>
                <span style={{ fontSize:13, fontWeight:600, color:t.text, flex:1 }}>{p.label}</span>
                {p.action==="copy" && copied && <span style={{ fontSize:11, color:MED.green }}>Copied!</span>}
                {p.action!=="copy" && shared  && <span style={{ fontSize:11, color:MED.green }}>Shared!</span>}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Root App ────────────────────────────────────────────────────────────────

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState("home");
  const [quizSubject, setQuizSubject] = useState(null);
  const [onboarded, setOnboarded] = useState(() => !!localStorage.getItem("mcq_onboarded"));
  const [showNotifs, setShowNotifs] = useState(false);
  const [showMockResult, setShowMockResult] = useState(false);
  const t = getTheme(tweaks.accentColor, tweaks.darkMode);
  const unreadNotifs = NOTIFS.filter(n=>n.unread).length;

  function completeOnboarding(data) {
    localStorage.setItem("mcq_onboarded", "1");
    if (data.name) setTweak("studentName", "Dr. " + data.name.replace(/^Dr\.\s*/i,""));
    setOnboarded(true);
  }

  // Show onboarding if not done
  if (!onboarded) {
    return (
      <window.IOSDevice dark={tweaks.darkMode}>
        <div style={{ width:"100%", height:"100%", display:"flex", flexDirection:"column", background:t.bg, fontFamily:"'Segoe UI', system-ui, sans-serif", fontSize:tweaks.fontSize }}>
          <OnboardingFlow t={t} onComplete={completeOnboarding}/>
        </div>
      </window.IOSDevice>
    );
  }

  const screens = {
    home:       <HomeScreen t={t} tweaks={tweaks} setScreen={setScreen} setQuizSubject={setQuizSubject}/>,
    bank:       <BankScreen t={t}/>,
    quiz:       <QuizScreen t={t} quizSubject={quizSubject}/>,
    duel:       <DuelScreen t={t} myName={tweaks.studentName}/>,
    rank:       <RankScreen t={t}/>,
    stats:      <StatsScreen t={t} setScreen={setScreen}/>,
    sr:         <SpacedRepScreen t={t}/>,
    quests:     <QuestScreen t={t} studentName={tweaks.studentName}/>,
    groups:     <GroupsScreen t={t} studentName={tweaks.studentName}/>,
    notifs:     <NotifScreen t={t}/>,
    mockresult: <MockResultScreen t={t} onBack={()=>setScreen("stats")}/>,
  };

  return (
    <>
      <window.IOSDevice dark={tweaks.darkMode}>
        <div style={{ width:"100%", height:"100%", display:"flex", flexDirection:"column", background: t.bg, fontFamily:"'Segoe UI', system-ui, sans-serif", fontSize: tweaks.fontSize, position:"relative" }}>
          {/* Notification bell overlay */}
          {screen !== "notifs" && (
            <button onClick={()=>setScreen("notifs")} style={{ position:"absolute", top:52, right:12, zIndex:100, background:"none", border:"none", cursor:"pointer", padding:4 }}>
              <div style={{ position:"relative" }}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={t.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                {unreadNotifs > 0 && (
                  <div style={{ position:"absolute", top:-4, right:-4, width:16, height:16, borderRadius:99, background:MED.red, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800, color:"#fff" }}>{unreadNotifs}</div>
                )}
              </div>
            </button>
          )}
          {screens[screen]}
          <BottomNav screen={screen} setScreen={setScreen} t={t}/>
        </div>
      </window.IOSDevice>

      <window.TweaksPanel>
        <window.TweakSection label="Appearance">
          <window.TweakColor label="Accent Color" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)}/>
          <window.TweakToggle label="Dark Mode" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)}/>
          <window.TweakSlider label="Font Size" value={tweaks.fontSize} min={12} max={18} step={1} onChange={v => setTweak('fontSize', v)}/>
        </window.TweakSection>
        <window.TweakSection label="Profile">
          <window.TweakText label="Your Name" value={tweaks.studentName} onChange={v => setTweak('studentName', v)}/>
          <window.TweakToggle label="Show Streak Badge" value={tweaks.showStreaks} onChange={v => setTweak('showStreaks', v)}/>
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
function renderWhenReady() {
  if (window.useTweaks && window.IOSDevice) {
    root.render(<App/>);
  } else {
    requestAnimationFrame(renderWhenReady);
  }
}
renderWhenReady();
</script>
<div id="root"></div>
</body>
</html>
